<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>استعادة كلمة المرور | يلا رياضة</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="يلا رياضة"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body>
  <div id="shared-header"></div>
  <main class="wrap page">
    <section class="panel account-reset-panel">
      <span class="kicker">PASSWORD RECOVERY</span>
      <h1>تعيين كلمة مرور جديدة</h1>
      <p class="sub">اكتب كلمة مرور جديدة لحسابك.</p>
      <form id="password-reset-form" class="form-stack">
        <label for="reset-password">كلمة المرور الجديدة
          <input id="reset-password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label for="reset-password-confirm">تأكيد كلمة المرور
          <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button id="reset-password-submit" class="btn primary" type="submit">حفظ كلمة المرور</button>
      </form>
      <p id="password-reset-message" class="note" role="status" aria-live="polite"></p>
      <a id="password-reset-back" class="btn outline" href="account.html">العودة إلى حسابي</a>
    </section>
  </main>
  <div id="shared-footer"></div>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="supabase-password-reset.js"></script>
<script src="install.js" defer></script></body>
</html>
