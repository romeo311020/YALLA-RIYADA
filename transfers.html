<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>سوق الانتقالات | يلا رياضة</title>
  <meta name="description" content="آخر أخبار سوق الانتقالات: صفقات رسمية ومفاوضات متقدمة وإعارات وإشاعات اللاعبين والأندية.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:site_name" content="يلا رياضة | YALLA RIYADA">
  <meta property="og:type" content="website">
  <meta property="og:title" content="سوق الانتقالات | يلا رياضة">
  <meta property="og:image" content="https://yalla-riyada-embd.vercel.app/og-image.png">
  <script>(function(){var d=document.documentElement,t="light";try{if(localStorage.getItem("yr-theme")==="dark")t="dark"}catch(e){}if(t==="light")d.setAttribute("data-theme","light")})()</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="transfers.css">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="يلا رياضة">
</head>
<body>
  <div id="shared-header"></div>
  <main class="wrap page tr-page">
    <span class="kicker">TRANSFER MARKET</span>
    <h1>سوق الانتقالات 🔄</h1>
    <p class="sub">آخر الصفقات الرسمية والمفاوضات والإعارات والإشاعات، أول بأول.</p>
    <div class="tr-tools">
      <div class="tr-chips" id="tr-filter" role="group" aria-label="تصفية الانتقالات">
        <button type="button" class="chip active" data-f="all">الكل</button>
        <button type="button" class="chip" data-f="official">✅ رسمي</button>
        <button type="button" class="chip" data-f="advanced">🔥 مفاوضات متقدمة</button>
        <button type="button" class="chip" data-f="loan">🔁 إعارة</button>
        <button type="button" class="chip" data-f="free">🆓 حر</button>
        <button type="button" class="chip" data-f="rumor">💬 إشاعات</button>
      </div>
      <input type="search" id="tr-q" placeholder="ابحث عن لاعب أو نادي…" aria-label="بحث في الانتقالات">
    </div>
    <div id="tr-list" class="tr-list" aria-live="polite" aria-busy="true"><p class="note">جارٍ التحميل…</p></div>
    <div class="tr-more"><button type="button" class="btn outline" id="tr-more" hidden>عرض المزيد</button></div>
    <p class="note">المصادر الرسمية والصحفية مذكورة مع كل خبر. الإشاعات غير مؤكدة حتى يُعلن النادي رسميًا.</p>
  </main>
  <div id="shared-footer"></div>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="transfers.js"></script>
<script src="install.js" defer></script></body>
</html>
