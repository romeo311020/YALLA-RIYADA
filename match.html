    <div id="match-body" hidden>

        <button type="button" class="tab tab-player" role="tab" data-tab="player" aria-selected="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg><span>المشغّل</span></button>

    </div>
