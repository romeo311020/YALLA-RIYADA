<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>تفاصيل المباراة | يلا رياضة</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:site_name" content="يلا رياضة | YALLA RIYADA">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://yalla-riyada-embd.vercel.app/og-image.png">
  
  <script>(function(){var d=document.documentElement,t="light";try{if(localStorage.getItem("yr-theme")==="dark")t="dark"}catch(e){}if(t==="light")d.setAttribute("data-theme","light")})()</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="predict.css">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="يلا رياضة"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="تفاصيل المباراة على يلا رياضة: الملخص والتشكيلة والإحصائيات."><meta property="og:title" content="تفاصيل المباراة | يلا رياضة"><meta property="og:description" content="تفاصيل المباراة على يلا رياضة: الملخص والتشكيلة والإحصائيات."><meta property="og:locale" content="ar_AR"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="index,follow"></head>
<body>
  <div id="shared-header"></div>
  <main class="wrap page wide">
    <h1 id="match-title" class="sr-only">تفاصيل المباراة</h1>
    <div class="watch-grid m-split">
    <div class="m-right">
    <section class="panel mh" id="match-hero">
      <div class="mh-glow mh-glow-a" aria-hidden="true"></div><div class="mh-glow mh-glow-b" aria-hidden="true"></div>
      <div class="mh-top"><span class="mh-league" id="mh-league"></span><span class="st" id="mh-status"></span></div>
      <div id="match-score" class="teams"></div>
      <div class="countdown" id="mh-count" hidden aria-live="off"></div>
      <p class="note">جارٍ تحميل تفاصيل المباراة...</p>
    </section>
    <div id="match-body" hidden>
      <div class="tabs" role="tablist" aria-label="أقسام المباراة">
        <button type="button" class="tab tab-player" role="tab" data-tab="player" aria-selected="false" hidden>المشغّل</button>
        <button type="button" class="tab" role="tab" data-tab="lineup" aria-selected="false">التشكيلة</button>
        <button type="button" class="tab active" role="tab" data-tab="summary" aria-selected="true">الملخص</button>
        <button type="button" class="tab" role="tab" data-tab="stats" aria-selected="false">الإحصائيات</button>
        <button type="button" class="tab" role="tab" data-tab="info" aria-selected="false">التفاصيل</button>
      </div>
      <section class="panel tab-panel" id="tab-summary" role="tabpanel"></section>
      <section class="panel tab-panel" id="tab-lineup" role="tabpanel" hidden></section>
      <section class="panel tab-panel" id="tab-stats" role="tabpanel" hidden></section>
      <section class="panel tab-panel" id="tab-info" role="tabpanel" hidden></section>
    </div>
    </div>
    <div class="m-left"><div id="pd-slot"></div>
    <section class="match-player" id="match-player" hidden>
      <div class="player-top"><h2><span class="live-dot"></span>البث المباشر</h2><button type="button" class="theater-close" id="theater-close">✕ إغلاق السينما</button></div>
      <div class="match-player-frame" id="match-player-frame"></div>
    </section>
    <aside class="watch-actions" id="match-actions" hidden aria-label="أدوات المشاهدة">
      <div class="player-bar" id="match-player-bar"></div>
    </aside>
    </div>
    </div>
  </main>
  <div id="shared-footer"></div>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="supabase-public.js"></script>
  <script src="names-ar.js"></script>
  <script src="predict.js"></script>
  <script src="supabase-football.js"></script>
<script src="install.js" defer></script></body>
</html>
